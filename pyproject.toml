[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aicv"
version = "1.0.0"
description = "AI Code Verifier — verification gate for AI-generated code (CLI + GitHub Action)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "bigpi" }]
keywords = ["code-review", "static-analysis", "ai-generated-code", "security", "ci"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/bigpi/ai-code-verifier"
Changelog = "https://github.com/bigpi/ai-code-verifier/blob/master/CHANGELOG.md"

[project.scripts]
aicv = "aicv.cli:main"

[tool.setuptools.packages.find]
include = ["aicv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
