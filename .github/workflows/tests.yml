# aicv test suite: pip install -e . + pytest on supported Python versions.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install aicv (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Install ruff (optional layer, graceful fallback)
        run: pip install ruff || true
      - name: Run pytest
        run: pytest -q
